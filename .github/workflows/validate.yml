name: Validate Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装开发依赖
        run: python -m pip install --upgrade pip -r requirements-dev.txt

      - name: 运行仓库级单元测试
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: 审计仓库
        run: python scripts/audit_skills.py --scan-shared-content

      - name: 验证 youtube-study-note
        run: python -m unittest discover -s plugins/learning-tools/youtube-study-note/tests -p 'test_*.py' -v

      - name: 验证 todo
        run: bash plugins/dev-tools/todo/tests/verify.sh

      - name: 验证 video-processing
        run: python -m unittest discover -s plugins/video-processing/tests -p 'test_*.py' -v

      - name: 验证 skill-stats
        run: python -m unittest discover -s plugins/skill-stats/skill-stats/tests -p 'test_*.py' -v

      - name: 检查安装脚本语法
        run: bash -n install.sh

  browser-control:
    name: 验证 browser-control (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: 运行 browser-control 测试
        run: node --test plugins/dev-tools/browser-control/tests/routing-contract.test.mjs plugins/dev-tools/browser-control/tests/usage-ledger.test.mjs

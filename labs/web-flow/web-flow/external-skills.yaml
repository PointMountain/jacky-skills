version: 1

runtime_status:
  file: ".web-flow/runs/<run_id>/preflight/external-skills.yaml"
  allowed: [available, degraded, missing]
  required_fields: [status, checked_at, evidence, selected, fallback]
  probe: on_first_use
  cache: per_run
  refresh: selected_capability_failed_or_evidence_stale
  policy:
    - 不把目录存在或工具自报成功当成可用证据
    - 同一能力在本轮复用已验证状态，不重复产生付费或外部副作用
    - evidence 必须脱敏，不保存凭证、私有 URL 或私有绝对路径

capabilities:
  reference_observation:
    candidates:
      - "chrome:control-chrome"
      - "browser:control-in-app-browser"
      - agent-browser
    probe: 打开一个参考页面并取得可复核的页面结构或截图
    fallback: 读取用户提供的源码、截图和文字证据

  prototype_design:
    candidates:
      - figma
      - dsl
      - crafted-web
      - html-artifacts
    probe: 用最小内容规格生成一个能真实打开的原型并检查桌面与移动视图
    fallback: 生成本地 HTML/CSS 原型

  visual_asset_generation:
    candidates:
      - imagegen
      - gpt-image-2
    probe: 生成一个低成本样例，确认真实文件存在且满足尺寸与格式要求
    fallback: 使用 CSS、SVG 或已有授权素材，不阻断结构原型

  browser_verification:
    candidates:
      - "chrome:control-chrome"
      - "browser:control-in-app-browser"
      - agent-browser
      - playwright-cli
    probe: 打开本地预览，检查桌面和移动断点并取得控制台或截图证据
    fallback: 使用可用浏览器手动检查并把证据写入本轮状态

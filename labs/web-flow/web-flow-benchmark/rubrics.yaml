version: 2
default_threshold: 3.5
max_rounds: 2

scale:
  min: 0
  max: 5
  anchors:
    0: 缺失、不可用或没有证据
    3: 基本可用，存在一个明确且可修的主要缺口
    5: 证据充分，完整满足本阶段目标

stages:
  research:
    threshold: 3.5
    must_pass:
      - key: content_spec_exists
        desc: 内容规格存在且可读取
      - key: sources_resolvable
        desc: 关键事实均能追溯到截图、代码、文档或用户原话
    dimensions:
      - key: content_completeness
        label: 内容完整度
        weight: 2
        desc: 覆盖完成页面目标所需的关键内容与状态
      - key: source_grounding
        label: 源接地
        weight: 2
        desc: 内容与参考证据一一对应，不编造
      - key: task_understanding
        label: 任务理解
        weight: 1
        desc: 受众、主行动和内容优先级清晰

  wireframe:
    threshold: 3.5
    must_pass:
      - key: wireframe_viewable
        desc: G1 草图可以真实打开或查看
      - key: content_traceable
        desc: 草图中的关键内容能追溯到内容规格
    dimensions:
      - key: information_architecture
        label: 信息架构
        weight: 2
        desc: 阅读路径、首屏重点与内容顺序合理
      - key: task_clarity
        label: 任务清晰度
        weight: 2
        desc: 用户能从结构中识别主行动和关键状态
      - key: responsive_structure
        label: 响应式结构
        weight: 1
        desc: 桌面与移动的结构变化有明确依据

  prototype:
    threshold: 3.5
    must_pass:
      - key: wireframe_viewable
        desc: G1 草图可以真实打开或查看
      - key: prototype_viewable
        desc: G2 原型可以在桌面与移动视图真实查看
      - key: content_traceable
        desc: 原型中的关键内容能追溯到内容规格
    dimensions:
      - key: information_architecture
        label: 信息架构
        weight: 2
        desc: 阅读路径、首屏重点与内容节奏合理
      - key: task_clarity
        label: 任务清晰度
        weight: 2
        desc: 用户能识别主行动和关键状态
      - key: visual_direction
        label: 视觉方向
        weight: 1
        desc: 原型形成一致且有辨识度的视觉主张
      - key: responsive_intent
        label: 响应式意图
        weight: 1
        desc: 桌面与移动布局变化有明确设计依据

  design:
    threshold: 3.5
    must_pass:
      - key: tokens_parseable
        desc: design tokens 存在且结构可读取
      - key: layout_contract_exists
        desc: sections、slots 与断点契约存在
    dimensions:
      - key: visual_consistency
        label: 视觉一致性
        weight: 2
        desc: 色彩、字体、间距与效果来自统一系统
      - key: hierarchy
        label: 层级清晰
        weight: 1
        desc: tokens 与布局能保持原型的主次关系
      - key: implementation_clarity
        label: 实现清晰度
        weight: 2
        desc: 并行执行者无需重新猜测关键设计决定

  build:
    threshold: 3.5
    must_pass:
      - key: preview_opens
        desc: 真实预览可以打开并显示关键内容
      - key: critical_resources_load
        desc: 关键脚本、样式和媒体资源没有致命加载失败
      - key: mobile_content_visible
        desc: 移动视图没有遮挡、溢出或永久隐藏的关键内容
    dimensions:
      - key: prototype_fidelity
        label: 原型还原度
        weight: 2
        desc: 信息、布局与视觉方向符合已选原型
      - key: motion_quality
        label: 动效质量
        weight: 2
        desc: 动效流畅、有意义且支持减少动态效果设置
      - key: implementation_quality
        label: 实现质量
        weight: 1
        desc: 结构清晰，section 之间不串味
      - key: responsive_quality
        label: 响应式质量
        weight: 2
        desc: 桌面与移动断点均保持可读和可操作

  deploy:
    threshold: 3.5
    must_pass:
      - key: production_http_success
        desc: 生产 URL 返回成功状态
      - key: production_browser_opens
        desc: 生产页面能在真实浏览器打开
      - key: critical_errors_absent
        desc: 没有阻断使用的控制台错误或关键资源失败
    dimensions:
      - key: delivery_clarity
        label: 交付清晰度
        weight: 1
        desc: URL、版本、验证证据与 residual 说明清楚
      - key: production_fidelity
        label: 线上一致性
        weight: 2
        desc: 线上页面与已验证预览保持一致

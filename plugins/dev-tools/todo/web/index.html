<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="基于 Markdown 与 YAML 的本地 Agent 任务看板"
    />
    <title>Todo / Agent Task Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="noise" aria-hidden="true"></div>
    <header class="topbar">
      <div>
        <p class="eyebrow">LOCAL TASK RUNTIME</p>
        <h1><span>TODO</span> / AGENT CONSOLE</h1>
      </div>
      <div class="system-status">
        <span class="status-dot" aria-hidden="true"></span>
        <div>
          <strong>FILESYSTEM ONLINE</strong>
          <small id="root-path">正在连接任务目录…</small>
        </div>
      </div>
    </header>

    <main>
      <section class="control-panel" aria-labelledby="capture-title">
        <div class="capture-copy">
          <p class="section-code">01 / CAPTURE</p>
          <h2 id="capture-title">把想法放进系统</h2>
          <p>先记录，再逐步塑造成可以长程执行的任务。</p>
        </div>
        <form id="quick-add-form" class="capture-form">
          <label for="quick-title">任务标题</label>
          <div class="capture-input-row">
            <input
              id="quick-title"
              name="title"
              required
              autocomplete="off"
              placeholder="例如：完成 Todo Web POC"
            />
            <button type="submit" class="primary-button">新增任务</button>
          </div>
        </form>
      </section>

      <aside id="legacy-notice" class="legacy-notice" hidden>
        <strong>检测到旧版 Todo 数据</strong>
        <p>
          其中有 <span id="legacy-count">0</span> 条任务尚未进入新看板。确认后运行
          <code>todo migrate --apply</code> 导入，原文件不会被自动删除。
        </p>
      </aside>

      <section class="metrics" aria-label="任务统计" id="metrics"></section>

      <section class="board-shell" aria-labelledby="board-title">
        <div class="board-heading">
          <div>
            <p class="section-code">02 / FLOW</p>
            <h2 id="board-title">任务状态流</h2>
          </div>
          <button id="refresh-button" class="ghost-button" type="button">
            ↻ 刷新文件
          </button>
        </div>
        <div id="board" class="board" aria-live="polite"></div>
      </section>
    </main>

    <dialog id="task-dialog" class="task-dialog">
      <form id="task-form" method="dialog">
        <header class="dialog-header">
          <div>
            <p id="dialog-task-id" class="section-code"></p>
            <h2>任务控制台</h2>
          </div>
          <button
            id="close-dialog"
            type="button"
            class="icon-button"
            aria-label="关闭"
          >
            ×
          </button>
        </header>

        <div class="form-grid">
          <label class="wide-field">
            <span>标题</span>
            <input id="task-title" name="title" required />
          </label>
          <label>
            <span>状态</span>
            <select id="task-status" name="status"></select>
          </label>
          <label id="basis-field">
            <span>Durable 判断依据</span>
            <select id="task-basis" name="durable_basis"></select>
          </label>
          <label>
            <span>项目</span>
            <input id="task-project" name="project" />
          </label>
          <label>
            <span>Workspace</span>
            <input id="task-workspace" name="workspace" />
          </label>
          <label class="wide-field">
            <span>References（每行一条）</span>
            <textarea id="task-references" name="references" rows="3"></textarea>
          </label>
          <label class="wide-field">
            <span>Markdown 正文</span>
            <textarea
              id="task-body"
              name="body"
              class="markdown-editor"
              rows="18"
            ></textarea>
          </label>
        </div>

        <footer class="dialog-actions">
          <button id="archive-button" type="button" class="danger-button">
            归档任务
          </button>
          <div>
            <button id="cancel-button" type="button" class="ghost-button">
              取消
            </button>
            <button type="submit" class="primary-button">保存修改</button>
          </div>
        </footer>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
